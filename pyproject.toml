[project]
name = "dwg-sheets"
version = "0.6.0"
description = "Tools for the sheets drawn in model space of a DWG/DXF. Today: export each sheet to its own PDF, at true scale, using CADCraft."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pypdfium2>=4.30", "pillow>=10"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1", "babel>=2.16"]

[project.scripts]
dwg-sheets = "dwg_sheets.cli:main"
dwg-sheets-web = "dwg_sheets.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "dwg-sheets[web]",
    "httpx2>=2.14.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
