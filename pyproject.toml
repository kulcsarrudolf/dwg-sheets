[project]
name = "dwg-sheets-to-pdf"
version = "0.1.1"
description = "Export every sheet drawn in model space of a DWG/DXF to its own PDF, at true scale, using CADCraft."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dwg-sheets-to-pdf = "dwg_sheets_to_pdf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
