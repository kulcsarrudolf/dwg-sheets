<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DWG Sheets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' fill='%23fff' stroke='%230b6e75' stroke-width='2'/%3E%3Crect x='8' y='10' width='18' height='12' fill='none' stroke='%230b6e75'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow working column, like a drawing register: drop a file, then read the sheet list. */
:root {
  --paper: #f7f8f6;
  --sheet: #ffffff;
  --ink: #1d2422;
  --graphite: #5c6662;
  --rule: #d9dedb;
  --accent: #0b6e75;      /* plotter teal */
  --accent-ink: #ffffff;
  --accent-soft: #e3f0f0;
  --ok: #2f7a3e;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141917; --sheet: #1b2220; --ink: #e6ebe8; --graphite: #9aa5a0; --rule: #2e3835;
    --accent: #4fb8be; --accent-ink: #0d1514; --accent-soft: #183a3c;
    --ok: #7ccb8a; --bad: #f2a29b; --bad-soft: #3a1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141917; --sheet: #1b2220; --ink: #e6ebe8; --graphite: #9aa5a0; --rule: #2e3835;
  --accent: #4fb8be; --accent-ink: #0d1514; --accent-soft: #183a3c;
  --ok: #7ccb8a; --bad: #f2a29b; --bad-soft: #3a1f1d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.55 var(--body);
}
[hidden] { display: none !important; }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 28px;
}

header { display: grid; gap: 6px; }
.eyebrow {
  font: 500 12px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--graphite);
}
h1 {
  margin: 0;
  font: 600 clamp(28px, 5vw, 40px)/1.1 var(--display);
  letter-spacing: -.01em;
  text-wrap: balance;
}
.lede { margin: 0; max-width: 62ch; color: var(--graphite); }

/* Drop zone: a sheet of paper with a dashed trim line. */
.drop {
  position: relative;
  display: grid;
  place-items: center;
  gap: 10px;
  min-height: 210px;
  padding: 32px 20px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.drop::before {
  content: "";
  position: absolute;
  inset: 12px 12px 12px 24px;   /* wider binding margin on the left, as on a real sheet */
  border: 1.5px dashed var(--rule);
  pointer-events: none;
  transition: border-color .15s;
}
.drop:hover::before, .drop:focus-visible::before, .drop.over::before { border-color: var(--accent); }
.drop.over { background: var(--accent-soft); }
.drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.drop.busy { cursor: progress; }
.drop .big { font: 600 20px/1.2 var(--display); }
.drop .small { color: var(--graphite); font-size: 13px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.status { display: grid; gap: 8px; }
.status-line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.status-text { font-weight: 500; }
.status-count { font: 13px var(--mono); color: var(--graphite); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--rule); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.bar.indeterminate > span { width: 30%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.alert { padding: 12px 14px; background: var(--bad-soft); color: var(--bad); border-left: 3px solid var(--bad); }

/* Sheet register */
.register { display: grid; gap: 14px; }
.register-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.register-head h2 { margin: 0; font: 600 22px/1.2 var(--display); }
.register-head .file { color: var(--graphite); font-size: 13px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  background: var(--sheet);
  color: var(--ink);
  font: 500 14px/1.2 var(--body);
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { border-color: var(--graphite); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--graphite); }
.btn.quiet:hover { color: var(--ink); }
.btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }

.table-scroll { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); }
td.name { font: 600 16px/1.2 var(--display); }
td.mono { font-family: var(--mono); font-size: 13px; }
td.links { text-align: right; }
.unit { color: var(--graphite); }
td.links .btn { padding: 5px 10px; font-size: 13px; }

/* Page outline drawn to the same scale for every sheet, so sizes compare at a glance. */
.page-box { display: inline-grid; place-items: end start; width: 64px; height: 46px; }
.page-box span { display: block; border: 1px solid var(--graphite); background: var(--paper); }
.page-box.double span { box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--graphite); }

.chip { display: inline-block; padding: 2px 8px; font: 500 12px/1.5 var(--body); background: var(--paper); border: 1px solid var(--rule); color: var(--graphite); }
.state { font: 500 13px var(--body); }
.state.done { color: var(--ok); }
.state.failed { color: var(--bad); }
.state.pending { color: var(--graphite); }

.skipped { margin: 0; padding-left: 18px; color: var(--graphite); font-size: 13px; }

.how { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.how div { display: grid; gap: 4px; align-content: start; }
.how h3 { margin: 0; font: 600 15px/1.3 var(--display); }
.how p { margin: 0; color: var(--graphite); font-size: 14px; }

footer { color: var(--graphite); font-size: 12px; border-top: 1px solid var(--rule); padding-top: 14px; }

/* Phones: each sheet becomes a small card so the download buttons stay in view. */
@media (max-width: 640px) {
  .table-scroll { overflow: visible; }
  table, tbody { display: block; }
  thead { display: none; }
  tr {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas: "name page" "scale page" "size status" "frame frame" "links links";
    gap: 4px 12px;
    padding: 14px;
    border-bottom: 1px solid var(--rule);
  }
  tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; white-space: normal; }
  td.name { grid-area: name; }
  td.scale { grid-area: scale; }
  td.page { grid-area: page; align-self: center; }
  td.size { grid-area: size; }
  td.frame { grid-area: frame; }
  td.state { grid-area: status; text-align: right; }
  td.links { grid-area: links; display: flex; gap: 8px; text-align: left; padding-top: 6px; }
  td.links:empty { display: none; }
  td.links .btn { flex: 1; justify-content: center; padding: 8px 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; animation: none !important; }
}

/* Language switcher: three plain segments, the active one filled. */
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.lang { display: inline-flex; border: 1px solid var(--rule); background: var(--sheet); }
.lang button {
  padding: 5px 10px;
  border: 0;
  background: transparent;
  color: var(--graphite);
  font: 500 12px/1.2 var(--mono);
  letter-spacing: .06em;
  cursor: pointer;
}
.lang button + button { border-left: 1px solid var(--rule); }
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="top">
      <span class="eyebrow">DWG / DXF &rarr; PDF</span>
      <div class="lang" role="group" id="lang" aria-label="Language">
        <button type="button" data-lang="en" lang="en" title="English">EN</button>
        <button type="button" data-lang="ro" lang="ro" title="Romana">RO</button>
        <button type="button" data-lang="hu" lang="hu" title="Magyar">HU</button>
      </div>
    </div>
    <h1>DWG Sheets</h1>
    <p class="lede" data-i18n="lede">Drop a drawing and get every sheet as its own PDF, plotted at the scale in its title block.</p>
  </header>

  <label class="drop" id="drop" tabindex="0" for="file">
    <span class="big" id="drop-title">Drop a .dwg or .dxf file here</span>
    <span class="small" id="drop-sub"></span>
    <input type="file" id="file" accept=".dwg,.dxf">
  </label>

  <section class="status" id="status" hidden aria-live="polite">
    <div class="status-line">
      <span class="status-text" id="status-text"></span>
      <span class="status-count" id="status-count"></span>
    </div>
    <div class="bar" id="bar"><span></span></div>
  </section>

  <div class="alert" id="error" role="alert" hidden></div>

  <section class="register" id="register" hidden>
    <div class="register-head">
      <div>
        <h2 id="register-title"></h2>
        <div class="file" id="register-file"></div>
      </div>
      <div class="actions">
        <a class="btn primary" id="zip" href="#" aria-disabled="true" data-i18n="zip">Download all (ZIP)</a>
        <button class="btn quiet" id="delete" type="button" data-i18n="delete">Delete files now</button>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-i18n="th.sheet">Sheet</th><th data-i18n="th.scale">Scale</th><th data-i18n="th.page">Page</th>
            <th data-i18n="th.size">Size</th><th data-i18n="th.frame">Frame</th><th data-i18n="th.status">Status</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <ul class="skipped" id="skipped" hidden></ul>
  </section>

  <section class="how" id="how">
    <div>
      <h3 data-i18n="how1.t">Finds each sheet</h3>
      <p data-i18n="how1.p"></p>
    </div>
    <div>
      <h3 data-i18n="how2.t">Keeps the scale</h3>
      <p data-i18n="how2.p"></p>
    </div>
    <div>
      <h3 data-i18n="how3.t">Frames the page</h3>
      <p data-i18n="how3.p"></p>
    </div>
  </section>

  <footer id="footer"></footer>
</main>

    "err.unreadable": "A rajzot nem sikerült beolvasni. Ellenőrizze, hogy megnyílik-e AutoCAD-ben, és próbálja újra.",
    "err.partial": "{total} tervlapból {failed} exportálása nem sikerült.",
    "err.unexpected": "Hiba történt az exportálás közben. Próbálja újra.",
    "err.upload": "A feltöltés nem sikerült ({status}-es hiba). Próbálja újra.",
    "err.network": "A feltöltés nem sikerült. Ellenőrizze a kapcsolatot, és próbálja újra.",
    "err.lost": "Megszakadt a kapcsolat a szerverrel. Töltse újra az oldalt az export megtekintéséhez."
  }
};
const LANGS = Object.keys(MESSAGES);
const LOCALES = { en: "en-GB", ro: "ro-RO", hu: "hu-HU" };

(() => {
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), input = $("file");
  const statusBox = $("status"), statusText = $("status-text"), statusCount = $("status-count"), bar = $("bar");
  const errorBox = $("error"), register = $("register"), rows = $("rows"), zip = $("zip"), skippedList = $("skipped");

  // ---- Language ----------------------------------------------------------
  function pickLang() {
    const fromUrl = new URLSearchParams(location.search).get("lang");
    if (LANGS.includes(fromUrl)) return fromUrl;
    try {
      const saved = localStorage.getItem("lang");
      if (LANGS.includes(saved)) return saved;
    } catch {}
    for (const l of navigator.languages || []) {
      const base = l.slice(0, 2).toLowerCase();
      if (LANGS.includes(base)) return base;
    }
    return "en";
  }
  let lang = pickLang();

  function t(key, params = {}) {
    let msg = MESSAGES[lang][key] ?? MESSAGES.en[key] ?? key;
    if (typeof msg === "object") {
      const forms = msg;
      msg = forms[new Intl.PluralRules(LOCALES[lang]).select(params.n)] ?? forms.other;
    }
    return msg.replace(/\{(\w+)\}/g, (_, k) => (k in params ? params[k] : `{${k}}`));
  }
  const num = (n) => Number(n).toLocaleString(LOCALES[lang], { maximumFractionDigits: 1 });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // What the page currently says, as keys, so a language switch can re-render it.
  let job = null, busy = false, pollTimer = null, deleted = false;
  let status = null;   // { key, params, done, total, indeterminate }
  let error = null;    // { key, params }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("footer").textContent = t("footer", { ttl: CONFIG.ttlMinutes });
    renderDrop();
    renderStatus();
    renderError();
    if (job) render(job);
  }

  $("lang").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-lang]");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch {}
    const url = new URL(location.href);
    if (url.searchParams.has("lang")) { url.searchParams.set("lang", lang); history.replaceState(null, "", url); }
    applyLang();
  });

  // ---- Rendering ---------------------------------------------------------
  function renderDrop() {
    $("drop-title").textContent = busy ? t("drop.busy") : deleted ? t("drop.deleted") : job ? t("drop.again") : t("drop.title");
    $("drop-sub").textContent = busy ? t("drop.busySub") : t("drop.sub", { mb: CONFIG.maxUploadMb });
  }

  function setStatus(key, params = {}, done = 0, total = 0, indeterminate = false) {
    status = key ? { key, params, done, total, indeterminate } : null;
    renderStatus();
  }

  function renderStatus() {
    statusBox.hidden = !status;
    if (!status) return;
    statusText.textContent = t(status.key, status.params);
    statusCount.textContent = status.total ? t("status.count", { done: num(status.done), total: num(status.total) }) : "";
    bar.classList.toggle("indeterminate", status.indeterminate);
    if (status.key !== "status.uploading") {
      bar.firstElementChild.style.width = status.indeterminate ? "" : `${status.total ? Math.round((status.done / status.total) * 100) : 0}%`;
    }
  }

  function setError(key, params = {}) {
    error = key ? { key, params } : null;
    renderError();
  }

  function renderError() {
    errorBox.hidden = !error;
    errorBox.textContent = error ? t(error.key, error.params) : "";
  }

  function setBusy(on) {
    busy = on;
    drop.classList.toggle("busy", on);
    renderDrop();
  }

  function render(j) {
    job = j;
    register.hidden = false;
    $("how").hidden = true;
    $("register-file").textContent = j.drawing;
    const sheets = j.sheets || [];
    const done = sheets.filter((s) => s.status !== "pending").length;
    $("register-title").textContent = t("sheets", { n: sheets.length });

    // One scale for every outline, set by the largest page.
    const maxW = Math.max(1, ...sheets.map((s) => s.page_mm[0]));
    const maxH = Math.max(1, ...sheets.map((s) => s.page_mm[1]));
    const k = Math.min(62 / maxW, 44 / maxH);

    rows.innerHTML = sheets.map((s) => {
      const [w, h] = s.page_mm;
      const links = s.url
        ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t("open"))}</a> <a class="btn" href="${esc(s.url)}?download=1">${esc(t("download"))}</a>`
        : "";
      return `<tr>
        <td class="name">${esc(s.name)}</td>
        <td class="mono scale">1:${num(s.scale)}</td>
        <td class="page"><span class="page-box${s.double ? " double" : ""}" title="${num(w)} × ${num(h)} mm"><span style="width:${Math.max(4, w * k)}px;height:${Math.max(4, h * k)}px"></span></span></td>
        <td class="mono size">${num(w)} &times; ${num(h)} <span class="unit">mm</span></td>
        <td class="frame"><span class="chip">${esc(t(s.double ? "frame.double" : "frame.single"))}</span></td>
        <td class="state ${esc(s.status)}">${esc(t(`state.${s.status}`))}</td>
        <td class="links">${links}</td>
      </tr>`;
    }).join("");

    const skipped = j.skipped || [];
    skippedList.hidden = !skipped.length;
    skippedList.innerHTML = skipped
      .map((s) => `<li>${esc(t("skipped", { name: s.name, reason: s.code ? t(`reason.${s.code}`) : s.reason }))}</li>`)
      .join("");

    zip.setAttribute("aria-disabled", j.zip_url ? "false" : "true");
    zip.href = j.zip_url || "#";

    if (j.status === "queued") setStatus("status.queued", {}, 0, 0, true);
    else if (j.status === "reading") setStatus("status.reading", {}, 0, 0, true);
    else if (j.status === "exporting") setStatus("status.exporting", {}, done, sheets.length);
    else if (j.status === "done") setStatus("status.done", {}, done, sheets.length);
    else setStatus(null);
    setError(j.error_code ? `err.${j.error_code}` : null, j.error_params || {});
  }

  // ---- Server ------------------------------------------------------------
  function errorFrom(body, status) {
    const d = body && body.detail;
    if (d && d.code) return [`err.${d.code}`, d.params || {}];
    return ["err.upload", { status }];
  }

  async function poll(id) {
    clearTimeout(pollTimer);
    try {
      const r = await fetch(`/api/jobs/${id}`, { cache: "no-store" });
      if (!r.ok) {
        setError(...errorFrom(await r.json().catch(() => ({})), r.status));
        setStatus(null);
        setBusy(false);
        return;
      }
      const j = await r.json();
      render(j);
      if (j.status === "done" || j.status === "failed") { setBusy(false); return; }
    } catch {
      setError("err.lost");
      setBusy(false);
      return;
    }
    pollTimer = setTimeout(() => poll(id), 700);
  }

  function upload(file) {
    if (busy || !file) return;
    if (!/\.(dwg|dxf)$/i.test(file.name)) { setError("err.bad_type"); return; }
    if (file.size > CONFIG.maxUploadMb * 1024 * 1024) { setError("err.too_large", { mb: CONFIG.maxUploadMb }); return; }
    setError(null);
    deleted = false;
    register.hidden = true;
    setBusy(true);
    setStatus("status.uploading", { name: file.name });
    bar.firstElementChild.style.width = "0%";

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/jobs");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) bar.firstElementChild.style.width = `${Math.round((e.loaded / e.total) * 100)}%`;
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 202) { render(body); poll(body.id); }
      else { setError(...errorFrom(body, xhr.status)); setStatus(null); setBusy(false); }
    };
    xhr.onerror = () => { setError("err.network"); setStatus(null); setBusy(false); };
    const form = new FormData();
    form.append("file", file);
    xhr.send(form);
  }

  input.addEventListener("change", () => { upload(input.files[0]); input.value = ""; });
  drop.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !busy) { e.preventDefault(); input.click(); } });
  drop.addEventListener("click", (e) => { if (busy) e.preventDefault(); });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); if (!busy) drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));
  // A file dropped outside the zone should not open in the tab.
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  $("delete").addEventListener("click", async () => {
    if (!job || busy) return;
    await fetch(`/api/jobs/${job.id}`, { method: "DELETE" }).catch(() => {});
    job = null;
    deleted = true;
    register.hidden = true;
    $("how").hidden = false;
    setStatus(null);
    setError(null);
    renderDrop();
  });

  applyLang();
})();
</script>
</body>
</html>
